[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papertrail-lab"
version = "0.1.0"
description = "Scrape, enrich, embed, and visualize papers shared in Slack"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Brian Schilder", email = "brian_schilder@alumni.brown.edu"},
]
keywords = ["slack", "papers", "embeddings", "visualization", "literature"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "requests>=2.28",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pyalex>=0.13",
    "jinja2>=3.1",
    "tqdm>=4.65",
    "click>=8.1",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
huggingface = ["huggingface-hub>=0.20"]
local = ["fastembed>=0.3"]
faiss = ["faiss-cpu>=1.7"]
umap = ["umap-learn>=0.5"]
viz = ["umap-learn>=0.5", "datamapplot>=0.4"]
all = ["openai>=1.0", "huggingface-hub>=0.20", "fastembed>=0.3", "faiss-cpu>=1.7", "umap-learn>=0.5", "datamapplot>=0.4"]
dev = ["pytest>=7.0", "mkdocs-material>=9.0", "mkdocstrings[python]>=0.24"]

[project.scripts]
papertrail = "papertrail.cli:main"

[project.urls]
Homepage = "https://github.com/bschilder/PaperTrail"
Documentation = "https://bschilder.github.io/PaperTrail"
Repository = "https://github.com/bschilder/PaperTrail"
Issues = "https://github.com/bschilder/PaperTrail/issues"

[tool.setuptools.packages.find]
include = ["papertrail*"]
