name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install mkdocs-material mkdocstrings[python]
          pip install -e ".[dev]"

      - name: Build docs
        run: mkdocs build --strict

      - name: Include dashboard if available
        run: |
          if [ -f papertrail_dashboard.html ]; then
            mkdir -p site/dashboard
            cp papertrail_dashboard.html site/dashboard/index.html
            echo "Dashboard copied to site/dashboard/"
          else
            echo "No dashboard HTML found, skipping"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
