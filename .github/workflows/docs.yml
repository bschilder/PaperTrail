name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip docs deploy for pipeline data commits (pipeline.yml handles its own deploy)
    if: "!contains(github.event.head_commit.message, '[pipeline]')"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[all,dev]"

      - name: Build docs
        run: mkdocs build --strict

      - name: Include dashboard if available
        run: |
          # Deploy dashboards for each workspace
          for cfg in config/*.yml; do
            WORKSPACE=$(python -c "import yaml; c=yaml.safe_load(open('$cfg')); url=c.get('slack_workspace_url',''); name=url.split('//')[1].split('.')[0] if '//' in url else 'dashboard'; print(name)" 2>/dev/null || echo "dashboard")
            DATAFILE="data/$WORKSPACE/papers_final.json"
            if [ -f "$DATAFILE" ]; then
              mkdir -p "site/$WORKSPACE"
              papertrail build "$DATAFILE" -o "site/$WORKSPACE/index.html"
              echo "Dashboard built → site/$WORKSPACE/"
            fi
          done
          # Fallback: legacy single-file dashboard
          if [ -f papertrail_dashboard.html ] && [ ! -f site/koolab/index.html ]; then
            mkdir -p site/koolab
            cp papertrail_dashboard.html site/koolab/index.html
          fi
          # Backward compat redirect
          mkdir -p site/dashboard
          echo "<meta http-equiv='refresh' content='0;url=../koolab/'>" > site/dashboard/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
