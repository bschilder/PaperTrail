name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip docs deploy for pipeline data commits (pipeline.yml handles its own deploy)
    if: "!contains(github.event.head_commit.message, '[pipeline]')"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[all,dev]"

      - name: Build docs
        run: mkdocs build --strict

      - name: Include dashboard if available
        run: |
          mkdir -p site/dashboard
          # Build fresh dashboard from data if available
          if [ -f data/papers_final.json ]; then
            papertrail build data/papers_final.json -o site/dashboard/index.html
            echo "Dashboard built from data/papers_final.json"
          elif [ -f papertrail_dashboard.html ]; then
            cp papertrail_dashboard.html site/dashboard/index.html
            echo "Dashboard copied from repo root"
          else
            echo "No dashboard available, skipping"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
