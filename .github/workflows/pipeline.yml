name: PaperTrail Pipeline

on:
  schedule:
    - cron: "0 2 * * 0"  # Weekly, Sunday 2am UTC
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: "Skip scraping, use existing data"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pipeline"
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[all,dev]"

      - name: Run pipeline
        timeout-minutes: 120
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL || format('{0}@users.noreply.github.com', github.actor) }}
        run: |
          set -e
          if [ "${{ inputs.skip_scrape }}" = "true" ] && [ -f data/papers_final.json ]; then
            echo "Skipping scrape, using existing data"
            papertrail -v run-pipeline -c config.yml -o build --skip-scrape --data-file data/papers_final.json
          else
            papertrail -v run-pipeline -c config.yml -o build
          fi

      - name: Build docs
        run: |
          mkdocs build --strict
          # Deploy dashboard under workspace name from config
          WORKSPACE=$(python -c "import yaml; c=yaml.safe_load(open('config.yml')); url=c.get('slack_workspace_url',''); name=url.split('//')[1].split('.')[0] if '//' in url else 'dashboard'; print(name)")
          echo "Dashboard path: $WORKSPACE"
          mkdir -p "site/$WORKSPACE"
          cp build/dashboard.html "site/$WORKSPACE/index.html"
          # Also keep /dashboard/ as redirect for backward compat
          mkdir -p site/dashboard
          echo "<meta http-equiv='refresh' content='0;url=../$WORKSPACE/'>" > site/dashboard/index.html

      - name: Commit updated data
        run: |
          cp build/papers_final.json data/papers_final.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/papers_final.json
          if ! git diff --staged --quiet; then
            git commit -m "Update paper data [pipeline]"
            git pull --rebase origin main
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: pipeline
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
