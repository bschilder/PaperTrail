name: PaperTrail Pipeline

on:
  schedule:
    - cron: "0 2 * * 0"  # Weekly, Sunday 2am UTC
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: "Skip scraping, use existing data"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pipeline"
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[all]"

      - name: Run pipeline
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ "${{ inputs.skip_scrape }}" = "true" ] && [ -f data/papers_final.json ]; then
            echo "Skipping scrape, using existing data"
            papertrail run-pipeline -c config.yml -o build --skip-scrape --data-file data/papers_final.json
          else
            papertrail run-pipeline -c config.yml -o build
          fi

      - name: Commit updated data
        run: |
          # Copy final data back to data/ for the repo
          cp build/papers_final.json data/papers_final.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/papers_final.json
          git diff --staged --quiet || git commit -m "Update paper data [pipeline]"
          git push

      - name: Build docs
        run: |
          pip install mkdocs-material mkdocstrings[python]
          mkdocs build --strict
          # Copy dashboard into docs site
          mkdir -p site/dashboard
          cp build/dashboard.html site/dashboard/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: pipeline
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
